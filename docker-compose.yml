services:
  matchbox:
    image: croeder/matchbox:latest
    ports:
      - "8080:8080"
    volumes:
      - matchbox-db:/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6

  jupyter:
    image: croeder/jupyter:latest
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - MATCHBOX_URL=http://matchbox:8080
    depends_on:
      matchbox:
        condition: service_healthy

volumes:
  matchbox-db:
